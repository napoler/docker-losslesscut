---
# This is an example compose file, adjust to your needs
name: losslesscut

services:
  losslesscut:
    image: ghcr.io/napoler/losslesscut:latest
    build: .
    restart: unless-stopped
    ports:
      - 5800:5800/tcp
    volumes:
      # Application configuration (persists across restarts)
      - ./config:/config:rw
      # Video files will be looked for here
      - ${HOME:-/home/user}:/storage:rw
      # Mount /mnt so LosslessCut can access files outside $HOME
      - /mnt:/mnt:rw
    environment:
      WEB_AUDIO: ${WEB_AUDIO:-1}
      DARK_MODE: ${DARK_MODE:-1}
      SECURE_CONNECTION: ${SECURE_CONNECTION:-1}
